info:
  name: Get My Analytics
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/analytics/me"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Owner-only. Returns profileViews, totalClicks, topLinks, recentClicks.
  Run Login first so {{token}} is set.
