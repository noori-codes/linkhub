info:
  name: Get All Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Auth required. Lists all users with safe fields only (no password / tokens).
