info:
  name: Get Me
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/123"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Returns the logged-in user (safe fields).
  Look for `emailVerified` — false until we build verify-email (next steps).
