info:
  name: Update Link
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/links/{{linkId}}"
  body:
    type: json
    data: |-
      {
        "title": "GitHub Profile",
        "isVisible": true
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
