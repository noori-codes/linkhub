info:
  name: Reorder Links
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/links/reorder"
  body:
    type: json
    data: |-
      {
        "links": [
          { "id": "{{linkId}}", "order": 1 }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
