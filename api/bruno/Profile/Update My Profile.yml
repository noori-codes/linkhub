info:
  name: Update My Profile
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/profiles/me"
  body:
    type: json
    data: '{ "status": "published" }'
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
