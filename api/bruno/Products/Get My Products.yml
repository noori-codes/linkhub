info:
  name: Get My Products
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/me"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Owner-only. Returns all products (including hidden), sorted by order.
