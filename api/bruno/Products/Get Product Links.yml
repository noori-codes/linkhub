info:
  name: Get Product Links
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/v1/products/{{productId}}/links"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Owner-only. Lists all buy/affiliate links for {{productId}} (including hidden).
