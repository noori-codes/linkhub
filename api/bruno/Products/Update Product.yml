info:
  name: Update Product
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/products/{{productId}}"
  body:
    type: json
    data: |-
      {
        "title": "Mechanical Keyboard (affiliate)",
        "isVisible": true
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Owner-only. Whitelist: title, description, imageUrl, order, isVisible.
