info:
  name: Signup
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/signup"
  body:
    type: json
    data: |-
      {
        "firstName": "Imran",
        "lastName": "Noori",
        "email": "imrannoori1919@gmail.com",
        "password": "password123",
        "passwordConfirm": "password123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = (typeof res.getBody === "function" ? res.getBody() : null) || res.body || {};
        if (body.token) {
          bru.setEnvVar("token", String(body.token));
          bru.setVar("token", String(body.token));
        }
        // Dev: keep verifyURL handy for Verify Email request
        if (body.verifyURL) {
          bru.setEnvVar("verifyURL", String(body.verifyURL));
          bru.setVar("verifyURL", String(body.verifyURL));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
