info:
  name: Signup
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/signup"
  body:
    type: json
    data: |-
      {
        "firstName": "Noorullah",
        "lastName": "Ahmadzai",
        "email": "noorullah.ahmadzai76@gmail.com",
        "password": "password123",
        "passwordConfirm": "password123"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = (typeof res.getBody === "function" ? res.getBody() : null) || res.body || {};
        if (body.token) {
          bru.setEnvVar("token", String(body.token));
          bru.setVar("token", String(body.token));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
