# If this block doesn't show in Bruno → Scripts tab,
# paste the same code manually (Post Response).
runtime:
  scripts:
    - type: after-response
      code: |-
        const body = (typeof res.getBody === "function" ? res.getBody() : null) || res.body || {};
        if (body.token) {
          bru.setEnvVar("token", String(body.token));
          bru.setVar("token", String(body.token));
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
