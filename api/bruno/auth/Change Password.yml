info:
  name: Change Password
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/users/updateMyPassword"
  body:
    type: json
    data: |-
      {
        "passwordCurrent": "password123",
        "password": "password123",
        "passwordConfirm": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
